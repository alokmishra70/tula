# Render blueprint for the API (free web service, Singapore).
services:
  - type: web
    name: tula-api
    runtime: node
    region: singapore
    plan: free
    healthCheckPath: /v1/health
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @tula/shared build &&
      pnpm --filter @tula/api build &&
      pnpm --filter @tula/api db:deploy
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: LLM_PROVIDERS
        value: gemini,groq
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: tula-private
      - key: STORAGE_SIGNING_SECRET
        generateValue: true
      - key: BACKGROUND_JOBS
        value: 'true'
